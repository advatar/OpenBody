name: SPARC research adapter

on:
  pull_request:
    paths:
      - "experiments/sparc/**"
      - ".github/workflows/sparc-research.yml"
  push:
    branches:
      - "research/sparc-*"
    paths:
      - "experiments/sparc/**"
      - ".github/workflows/sparc-research.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Run SPARC research tests
        run: python3 -m unittest discover -s experiments/sparc -p 'test_*.py' -v

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Continuous healthcare learning loop</title><desc id="desc">Observe, model, predict, intervene, measure, and learn in a continuous loop.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#178f91"/></marker><style>.t{font-family:Inter,Arial,sans-serif;fill:#15324b;font-size:19px;font-weight:700}.line{stroke:#178f91;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="390" rx="28" fill="#f7faf9"/>
  <text x="600" y="50" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" fill="#15324b">Every intervention becomes an experiment</text>
  <path class="line" d="M245 135C360 65 480 65 575 115M625 115C720 65 840 65 955 135M1000 175C1040 240 955 310 840 315M795 315C675 355 525 355 405 315M360 315C245 310 160 240 200 175"/>
  <g text-anchor="middle" class="t"><circle cx="200" cy="155" r="58" fill="#fff" stroke="#8bbbc2" stroke-width="3"/><text x="200" y="162">Observe</text><circle cx="400" cy="105" r="58" fill="#e7f5f3" stroke="#178f91" stroke-width="3"/><text x="400" y="112">Model</text><circle cx="600" cy="105" r="58" fill="#e7f5f3" stroke="#178f91" stroke-width="3"/><text x="600" y="112">Predict</text><circle cx="800" cy="105" r="58" fill="#fff0eb" stroke="#e6795e" stroke-width="3"/><text x="800" y="112">Intervene</text><circle cx="1000" cy="155" r="58" fill="#fff" stroke="#8bbbc2" stroke-width="3"/><text x="1000" y="162">Measure</text><circle cx="800" cy="315" r="58" fill="#e7f5f3" stroke="#178f91" stroke-width="3"/><text x="800" y="322">Learn</text><circle cx="400" cy="315" r="58" fill="#15324b"/><text x="400" y="322" fill="#fff">Recalibrate</text></g>
</svg>

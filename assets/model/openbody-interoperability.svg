  <rect width="1200" height="520" rx="28" fill="#f7faf9"/>
  <text x="600" y="52" text-anchor="middle" class="t h">An interface to the computational human</text>
  <g class="line"><path d="M600 180L230 125M600 180L970 125M600 270L195 270M600 270L1005 270M600 360L230 415M600 360L970 415"/></g>
  <circle cx="600" cy="270" r="135" fill="#15324b"/><text x="600" y="250" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">OpenBody</text><text x="600" y="286" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#cfe9e8">authorized, queryable</text><text x="600" y="315" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#cfe9e8">uncertainty-aware</text>

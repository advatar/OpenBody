<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">OpenBody interoperability</title><desc id="desc">OpenBody links an individual digital twin to healthcare participants and systems.</desc>
